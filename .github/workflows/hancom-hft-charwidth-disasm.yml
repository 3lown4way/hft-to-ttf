name: Hancom HFT char width disassembly

on:
  push:
    branches: [rhwp-smoke-20260825]
    paths:
      - '.github/workflows/hancom-hft-charwidth-disasm.yml'
  pull_request:
    branches: [main, rhwp-ci-base]
    paths:
      - '.github/workflows/hancom-hft-charwidth-disasm.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Download and extract official viewer
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -H 'Referer: https://www.hancom.com/' \
            -A 'Mozilla/5.0' \
            'https://cdn.hancom.com/pds/hnc/VIE/hancomoffice-hwpviewer-Ubuntu-amd64.deb' \
            -o hancom-viewer.deb
          mkdir deb
          cd deb
          ar x ../hancom-viewer.deb
          tar -xf data.tar.*
          cd ..
          test -x deb/usr/bin/hwpviewer

      - name: Disassemble HFT width path
        shell: bash
        run: |
          set -euo pipefail
          BIN=deb/usr/bin/hwpviewer
          OUT=hancom-hft-charwidth-disasm.txt
          : > "$OUT"
          echo '=== ELF ===' >> "$OUT"
          file "$BIN" >> "$OUT"
          readelf -h "$BIN" | grep -E 'Type:|Machine:|Entry point' >> "$OUT"
          echo >> "$OUT"
          echo '=== TARGET SYMBOLS ===' >> "$OUT"
          readelf -Ws "$BIN" | grep -E 'HFTGetCharWidth|HncGetHFTCharWidth|GetFontWidth|GetFontEMSize|HncDRGetHFTTypeInfo|HFTGetGlyphOutline|HncGetHFTFontStyles|GetGlyphIndex\(' >> "$OUT" || true
          echo >> "$OUT"
          for sym in HFTGetCharWidth HncGetHFTCharWidth GetFontWidth GetFontEMSize HncDRGetHFTTypeInfo HFTGetGlyphOutline HncGetHFTFontStyles; do
            echo "=== DISASSEMBLY $sym ===" >> "$OUT"
            objdump -d -C --no-show-raw-insn --disassemble="$sym" "$BIN" >> "$OUT" 2>&1 || true
            echo >> "$OUT"
          done

          echo '=== C++ FONT GUIDE WIDTH WRAPPERS ===' >> "$OUT"
          for sym in \
            _ZN13CHncFontGuide12GetFontWidthEwPK10tag_HFTDES \
            _ZN13CHncFontGuide13_GetFontWidthEwiiPi \
            _ZN13CHncFontGuide15HFTGetCharWidthEPKw10HNCLANGDEFjiiii \
            _ZN13CHncFontGuide18HncGetHFTCharWidthEPKw10HNCLANGDEFji; do
            echo "--- $sym ---" >> "$OUT"
            objdump -d -C --no-show-raw-insn --disassemble="$sym" "$BIN" >> "$OUT" 2>&1 || true
          done
          echo >> "$OUT"

          # GetFontWidth calls two internal helpers at 0x179a170 and 0x179a400.
          # Dump a narrow range only, enough to reconstruct the width-source decision.
          echo '=== INTERNAL WIDTH HELPER RANGE 0x179A100..0x179A4C0 ===' >> "$OUT"
          objdump -d -C --no-show-raw-insn \
            --start-address=0x179a100 --stop-address=0x179a4c0 "$BIN" >> "$OUT" 2>&1 || true
          echo >> "$OUT"

          # GetFontWidth/GetFontEMSize index small selector tables here.
          echo '=== FONT SELECTOR DATA 0x2B74680..0x2B74720 ===' >> "$OUT"
          objdump -s --start-address=0x2b74680 --stop-address=0x2b74720 "$BIN" >> "$OUT" 2>&1 || true
          echo >> "$OUT"

          echo '=== CALL SITES REFERENCING WIDTH SYMBOLS ===' >> "$OUT"
          objdump -d -C --no-show-raw-insn "$BIN" 2>/dev/null \
            | grep -E -B 8 -A 14 'call.*<(HFTGetCharWidth|HncGetHFTCharWidth|GetFontWidth|GetFontEMSize)>' \
            | head -n 1000 >> "$OUT" || true
          echo >> "$OUT"
          echo '=== NEARBY EXPORTED HFT/FONT FUNCTIONS ===' >> "$OUT"
          nm -D -C "$BIN" 2>/dev/null \
            | grep -E ' (HFT|HncGetHFT|HncDRGetHFT|GetFont(Width|EMSize|FamilyCategory)|GetGlyphIndex\(|GetBmBitmap\(|GetOlBitmap\()' \
            | sort >> "$OUT" || true
          cat "$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: hancom-hft-charwidth-disasm
          path: hancom-hft-charwidth-disasm.txt
          if-no-files-found: error
