name: Convert HFT fonts to TTF

on:
  push:
    branches: [main]
    paths-ignore:
      - 'output_ttf/**'
  workflow_dispatch:
    inputs:
      commit_results:
        description: 'Commit generated TTF files back to the repository'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  convert:
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Restore required 48 HFT files
        shell: pwsh
        run: |
          $zip = 'inputs/kice09-required48.zip'
          if (-not (Test-Path $zip)) {
            throw "Missing $zip. Upload kice09-required48.zip to the inputs/ folder."
          }
          if (Test-Path fonts) { Remove-Item fonts -Recurse -Force }
          New-Item -ItemType Directory -Path fonts | Out-Null
          Expand-Archive -Path $zip -DestinationPath fonts -Force
          $count = (Get-ChildItem fonts -File -Filter *.HFT).Count
          if ($count -ne 48) { throw "Expected 48 HFT files, found $count" }
          Write-Host "Restored $count HFT files."

      - name: Verify required-file SHA256 hashes
        shell: pwsh
        run: python scripts/verify_required48.py fonts manifests/kice09_required48_sha256.txt

      - name: Convert HFT to TTF with v3.4
        shell: pwsh
        run: python scripts/run_converter.py --input fonts --output output_ttf --converter converter

      - name: Validate generated TTF files
        shell: pwsh
        run: python scripts/validate_ttf.py output_ttf

      - name: Upload converted fonts artifact
        uses: actions/upload-artifact@v7
        with:
          name: converted-ttf-${{ github.run_number }}
          path: |
            output_ttf/**/*.ttf
            output_ttf/**/*.TTF
          if-no-files-found: error
          compression-level: 0

      - name: Commit generated TTF files
        if: ${{ github.event_name == 'push' || inputs.commit_results }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output_ttf
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No generated font changes to commit."
            exit 0
          }
          git commit -m "build: regenerate TTF fonts"
          git push
