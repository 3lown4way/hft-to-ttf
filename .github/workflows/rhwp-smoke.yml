name: rhwp HWP smoke test

on:
  push:
    branches: [rhwp-smoke-20260825]
    paths:
      - '.github/workflows/rhwp-smoke.yml'
      - 'tools/patch_rhwp_hft_native.py'
      - 'tools/patch_rhwp_hft_synthetic_bold.py'
      - 'tools/audit_hft_source_truth.py'
      - 'converter/KICE09_HFT_converter_v3_4/**'
      - 'output_ttf/**'
  pull_request:
    branches: [main, rhwp-ci-base]
    paths:
      - '.github/workflows/rhwp-smoke.yml'
      - 'tools/patch_rhwp_hft_native.py'
      - 'tools/patch_rhwp_hft_synthetic_bold.py'
      - 'tools/audit_hft_source_truth.py'
      - 'converter/KICE09_HFT_converter_v3_4/**'
      - 'output_ttf/**'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout font repo
        uses: actions/checkout@v7

      - name: Download original 2009 June HWP and PDF oracle
        shell: bash
        run: |
          set -euxo pipefail
          HWP_URL='https://t1.daumcdn.net/cfile/tistory/262D61365269C48115'
          PDF_URL='https://t1.daumcdn.net/cfile/tistory/1542AA124CE785323E'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -e 'https://legendstudy.com/223' "$HWP_URL" -o input.hwp
          echo '59af2533f5a12fee6685f9c9f3b8a646a54997badaba3c062138c7d04f5e6205  input.hwp' | sha256sum -c -
          # Comparison-only oracle: never used as a glyph/metric source.
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -e 'https://savetest.com/18' "$PDF_URL" -o original-2009-june-language.pdf
          file original-2009-june-language.pdf

      - name: Audit HFT source truth
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --quiet fonttools
          python tools/audit_hft_source_truth.py | tee hft-source-audit.txt

      - name: Prepare runtime faces without PDF glyph repair
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime_fonts
          python - <<'PY'
          from fontTools.ttLib import TTFont
          from pathlib import Path
          import shutil

          src=Path('output_ttf')
          dst=Path('runtime_fonts')
          for i,p in enumerate(sorted(src.glob('*.ttf')),1):
              out=dst/p.name
              shutil.copy2(p,out)
              f=TTFont(out)
              ps=f'KICE09HFT{i:02d}-Regular'
              for n in f['name'].names:
                  if n.nameID == 6:
                      n.string = ps.encode('utf-16-be') if n.isUnicode() else ps.encode('latin1')
              f.save(out)
          print('runtime fonts', len(list(dst.glob('*.ttf'))))
          PY
          test ! -e runtime_fonts/.pdf-patched

      - name: Build rhwp metric generator and inject runtime TTF hmtx
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v0.8.4 https://github.com/edwardkim/rhwp.git rhwp-src
          cd rhwp-src
          cargo build --release --bin font-metric-gen
          ./target/release/font-metric-gen --dir ../runtime_fonts --output src/renderer/font_metrics_data.rs | tee ../runtime-font-metric-gen.txt
          grep -F '한양견명조' src/renderer/font_metrics_data.rs
          grep -F '신명 중명조 - 한양문자' src/renderer/font_metrics_data.rs

      - name: Build rhwp v0.8.4 with HFT-native bridges
        shell: bash
        run: |
          set -euxo pipefail
          python tools/patch_rhwp_hft_native.py rhwp-src
          python tools/patch_rhwp_hft_synthetic_bold.py rhwp-src
          cd rhwp-src
          cargo build --release --bin rhwp
          ./target/release/rhwp capabilities > ../rhwp-capabilities.json

      - name: Render untouched HWP with HFT-derived faces
        shell: bash
        env:
          RHWP_FONT_PATH: ${{ github.workspace }}/runtime_fonts
        run: |
          set -euxo pipefail
          RHWP='./rhwp-src/target/release/rhwp'
          mkdir -p out/svg out/dump-pages
          "$RHWP" info input.hwp > out/info.txt
          for p in 0 1 2 3 4; do
            "$RHWP" export-svg input.hwp -p "$p" -o out/svg
            "$RHWP" export-pdf input.hwp -p "$p" --text-as-paths -o "out/page-$((p+1))-paths.pdf"
            "$RHWP" export-pdf input.hwp -p "$p" -o "out/page-$((p+1))-embedded.pdf"
            "$RHWP" dump-pages input.hwp -p "$p" > "out/dump-pages/page-$((p+1)).txt"
          done

      - name: Collect non-blocking SVG diagnostics
        if: always()
        shell: bash
        run: |
          python - <<'PY' | tee svg-diagnostics.txt
          import html, re
          from pathlib import Path

          svgs=sorted(Path('out/svg').glob('*.svg'))
          print('SVG_COUNT', len(svgs))
          for path in svgs:
              s=path.read_text(encoding='utf-8')
              plain=html.unescape(re.sub(r'<[^>]+>', '', s))
              if '【' in s or '【' in plain:
                  print('BRACKET_FILE', path.name)
                  for m in re.finditer(r'<text\b[^>]*>.*?</text>', s, re.S):
                      node=m.group(0)
                      txt=html.unescape(re.sub(r'<[^>]+>', '', node))
                      if '【' in txt or '】' in txt:
                          print('BRACKET_NODE', path.name, repr(txt[:120]), node[:500].replace('\n',' '))
              if '10.' in plain:
                  print('QUESTION10_FILE', path.name)
                  for m in re.finditer(r'<text\b[^>]*>.*?</text>', s, re.S):
                      node=m.group(0)
                      txt=html.unescape(re.sub(r'<[^>]+>', '', node))
                      if '10.' in txt:
                          print('QUESTION10_NODE', path.name, repr(txt[:120]), node[:500].replace('\n',' '))
                          break
          all_svg='\n'.join(p.read_text(encoding='utf-8') for p in svgs)
          print('LEGACY_HFT_BOLD_STROKE', 'stroke-width="0.16"' in all_svg)
          print('GENERIC_BOLD_MARKER', 'font-weight="bold"' in all_svg)
          PY

      - name: Verify legacy HFT bold paint semantics
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          grep -R -F 'stroke-width="0.16"' out/svg/input_002.svg
          # Career-table heading brackets are legacy HFT Bold.  They must use
          # Regular-face fill+stroke rather than browser/CSS synthetic bold.
          python - <<'PY'
          import re, html
          from pathlib import Path
          s=Path('out/svg/input_002.svg').read_text(encoding='utf-8')
          nodes=[]
          for m in re.finditer(r'<text\b[^>]*>.*?</text>', s, re.S):
              node=m.group(0)
              txt=html.unescape(re.sub(r'<[^>]+>', '', node))
              if txt in {'【','】'} and '신명 중명조 - 한양문자' in html.unescape(node):
                  nodes.append(node)
          if not nodes:
              raise SystemExit('career-heading legacy HFT bold sample not found')
          for node in nodes:
              if 'stroke-width="0.16"' not in node:
                  raise SystemExit('legacy HFT bold is missing fill+stroke paint')
              if 'font-weight="bold"' in node:
                  raise SystemExit('legacy HFT bold still asks for synthetic/separate bold face')
          print('OK legacy HFT bold brackets use Regular fill+stroke:', len(nodes))
          PY

      - name: Upload smoke-test artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rhwp-kice09-hft-native-pages
          path: |
            out/**
            hft-source-audit.txt
            runtime-font-metric-gen.txt
            svg-diagnostics.txt
            rhwp-capabilities.json
            rhwp-src/src/renderer/font_metrics_data.rs
          if-no-files-found: error
          compression-level: 0
