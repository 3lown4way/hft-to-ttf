name: rhwp HWP smoke test

on:
  push:
    branches: [rhwp-smoke-20260825]
    paths:
      - '.github/workflows/rhwp-smoke.yml'
      - 'tools/patch_rhwp_kice09.py'
      - 'tools/patch_kice09_type3_punctuation.py'
      - 'tools/patch_kice09_type3_symbols.py'
      - 'tools/patch_kice09_pdf_faces.py'
  pull_request:
    branches: [main, rhwp-ci-base]
    paths:
      - '.github/workflows/rhwp-smoke.yml'
      - 'tools/patch_rhwp_kice09.py'
      - 'tools/patch_kice09_type3_punctuation.py'
      - 'tools/patch_kice09_type3_symbols.py'
      - 'tools/patch_kice09_pdf_faces.py'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout font repo
        uses: actions/checkout@v7

      - name: Download original 2009 June HWP and PDF oracles
        shell: bash
        run: |
          set -euxo pipefail
          HWP_URL='https://t1.daumcdn.net/cfile/tistory/262D61365269C48115'
          PDF_URL='https://t1.daumcdn.net/cfile/tistory/1542AA124CE785323E'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -e 'https://legendstudy.com/223' "$HWP_URL" -o input.hwp
          echo '59af2533f5a12fee6685f9c9f3b8a646a54997badaba3c062138c7d04f5e6205  input.hwp' | sha256sum -c -
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -e 'https://savetest.com/18' "$PDF_URL" -o original-2009-june-language.pdf
          file original-2009-june-language.pdf

      - name: Prepare KICE09 regular and real-bold runtime faces
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --quiet fonttools pypdf
          mkdir -p runtime_fonts
          python - <<'PY'
          from fontTools.ttLib import TTFont
          from pathlib import Path
          import shutil
          src=Path('output_ttf'); dst=Path('runtime_fonts')
          for i,p in enumerate(sorted(src.glob('*.ttf')),1):
              out=dst/p.name
              shutil.copy2(p,out)
              f=TTFont(out)
              ps=f'KICE09Combo{i:02d}-Regular'
              for n in f['name'].names:
                  if n.nameID==6:
                      if n.isUnicode(): n.string=ps.encode('utf-16-be')
                      else: n.string=ps.encode('latin1')
              f.save(out)
          PY
          python tools/patch_kice09_type3_punctuation.py runtime_fonts
          python tools/patch_kice09_type3_symbols.py runtime_fonts
          # T9's PDF space CharProc intentionally has d1 advance 0 while its Widths
          # entry is 1000; whitespace is not a drawable glyph repair target.
          sed -i 's/if len(ch) != 1 or code not in names:/if len(ch) != 1 or ch.isspace() or code not in names:/' tools/patch_kice09_pdf_faces.py
          python tools/patch_kice09_pdf_faces.py runtime_fonts original-2009-june-language.pdf
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          for p in sorted(Path('runtime_fonts').glob('*Bold.ttf')):
              f=TTFont(p)
              fam=[]; sub=[]; ps=[]
              for n in f['name'].names:
                  if n.nameID in (1,2,6) and n.platformID==3:
                      try: val=n.toUnicode()
                      except Exception: continue
                      if n.nameID==1: fam.append(val)
                      elif n.nameID==2: sub.append(val)
                      else: ps.append(val)
              print('BOLD_FACE',p.name,'family=',fam[:1],'sub=',sub[:1],'ps=',ps[:1],
                    'weight=',getattr(f.get('OS/2'),'usWeightClass',None))
          PY

      - name: Build rhwp v0.8.4 with KICE09 bridges
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v0.8.4 https://github.com/edwardkim/rhwp.git rhwp-src
          python tools/patch_rhwp_kice09.py rhwp-src
          cd rhwp-src
          cargo build --release --bin rhwp
          ./target/release/rhwp capabilities > ../rhwp-capabilities.json

      - name: Render untouched HWP with KICE09 faces
        shell: bash
        env:
          RHWP_FONT_PATH: ${{ github.workspace }}/runtime_fonts
        run: |
          set -euxo pipefail
          RHWP='./rhwp-src/target/release/rhwp'
          mkdir -p out/svg out/dump-pages
          "$RHWP" info input.hwp > out/info.txt
          for p in 0 1 2 3 4; do
            "$RHWP" export-svg input.hwp -p "$p" -o out/svg
            "$RHWP" export-pdf input.hwp -p "$p" --text-as-paths -o "out/page-$((p+1))-paths.pdf"
            "$RHWP" export-pdf input.hwp -p "$p" -o "out/page-$((p+1))-embedded.pdf"
            "$RHWP" dump-pages input.hwp -p "$p" > "out/dump-pages/page-$((p+1)).txt"
          done

      - name: Verify KICE09 bracket advance and bold markers
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          svg=Path('out/svg/input_002.svg').read_text(encoding='utf-8')
          items=[]
          for m in re.finditer(r'<text[^>]*x="([0-9.]+)"[^>]*>(.*?)</text>',svg):
              text=re.sub(r'<[^>]+>','',m.group(2))
              items.append((float(m.group(1)),text,m.group(0)))
          found=False
          for i,(x,t,raw) in enumerate(items[:-1]):
              if t=='【' and 'font-weight="bold"' in raw:
                  nx,nt,_=items[i+1]
                  if nt and nt!='】':
                      adv=nx-x
                      print('BOLD_OPEN_BRACKET_ADV',adv,'next=',nt)
                      if adv < 8.0:
                          raise SystemExit(f'opening bracket advance still too narrow: {adv}')
                      found=True
                      break
          if not found:
              raise SystemExit('bold opening bracket sample not found')
          if 'font-weight="bold"' not in svg:
              raise SystemExit('bold SVG markers missing')
          PY

      - name: Upload smoke-test artifact
        uses: actions/upload-artifact@v7
        with:
          name: rhwp-kice09-composite-pages
          path: |
            out/**
            rhwp-capabilities.json
          if-no-files-found: error
          compression-level: 0
