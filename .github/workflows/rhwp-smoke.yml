name: rhwp HWP smoke test

on:
  push:
    branches: [rhwp-smoke-20260825]
    paths:
      - '.github/workflows/rhwp-smoke.yml'
  pull_request:
    branches: [main, rhwp-ci-base]
    paths:
      - '.github/workflows/rhwp-smoke.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout font repo
        uses: actions/checkout@v7

      - name: Download original 2009 June HWP
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://t1.daumcdn.net/cfile/tistory/262D61365269C48115'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -e 'https://legendstudy.com/223' "$URL" -o input.hwp
          echo '59af2533f5a12fee6685f9c9f3b8a646a54997badaba3c062138c7d04f5e6205  input.hwp' | sha256sum -c -

      - name: Prepare runtime font copies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --quiet fonttools
          mkdir -p runtime_fonts
          python - <<'PY'
          from fontTools.ttLib import TTFont
          from pathlib import Path
          import shutil
          src=Path('output_ttf'); dst=Path('runtime_fonts')
          for i,p in enumerate(sorted(src.glob('*.ttf')),1):
              out=dst/p.name
              shutil.copy2(p,out)
              f=TTFont(out)
              ps=f'KICE09Combo{i:02d}-Regular'
              for n in f['name'].names:
                  if n.nameID==6:
                      if n.isUnicode(): n.string=ps.encode('utf-16-be')
                      else: n.string=ps.encode('latin1')
              f.save(out)
          PY
          python tools/patch_kice09_type3_punctuation.py runtime_fonts
          python tools/patch_kice09_type3_symbols.py runtime_fonts

      - name: Build rhwp v0.8.4 with KICE09 font and layout bridges
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v0.8.4 https://github.com/edwardkim/rhwp.git rhwp-src
          python - <<'PY'
          from pathlib import Path

          # 1) KICE09 charPr -> composite TTF family bridge
          p=Path('rhwp-src/src/renderer/style_resolver.rs')
          s=p.read_text(encoding='utf-8')
          old='''fn resolve_char_styles(doc_info: &DocInfo, dpi: f64) -> Vec<ResolvedCharStyle> {\n    doc_info\n        .char_shapes\n        .iter()\n        .map(|cs| resolve_single_char_style(cs, doc_info, dpi))\n        .collect()\n}\n'''
          new='''fn kice09_composite_family(char_pr_id: usize) -> Option<&'static str> {\n    match char_pr_id {\n        0 | 68 => Some("한양중고딕"),\n        1 | 19 | 20 => Some("신명 디나루"),\n        2 | 25 => Some("신명 중고딕"),\n        5 | 11 | 17 | 42 | 49 | 59 | 63 | 72 | 82 | 84 | 85 => Some("신명 중명조 - 한양영문"),\n        6 | 93 => Some("신명 중명조"),\n        7 | 8 | 9 | 12 | 13 | 14 | 15 | 23 | 24 | 29 | 32 | 33 | 34 | 47 | 56 | 60 | 61 | 64 | 65 | 67 | 70 | 71 | 74 | 75 | 76 | 77 | 78 | 79 | 80 | 81 | 83 | 86 | 88 | 89 | 90 | 91 | 92 | 94 | 95 | 99 | 100 | 101 | 102 | 103 | 104 | 105 | 106 | 107 => Some("신명 중명조 - 한양문자"),\n        16 | 73 | 87 => Some("신명 태고딕"),\n        10 | 18 => Some("한양견명조"),\n        21 | 48 | 54 | 55 => Some("신명 견명조"),\n        22 => Some("#태고딕"),\n        46 | 51 | 52 | 53 | 57 | 58 => Some("신명 신그래픽"),\n        50 => Some("신명 궁서"),\n        96 | 97 | 98 => Some("신명 중고딕 - 혼합"),\n        _ => None,\n    }\n}\n\nfn resolve_char_styles(doc_info: &DocInfo, dpi: f64) -> Vec<ResolvedCharStyle> {\n    doc_info\n        .char_shapes\n        .iter()\n        .enumerate()\n        .map(|(char_pr_id, cs)| {\n            let mut style = resolve_single_char_style(cs, doc_info, dpi);\n            if doc_info.char_shapes.len() == 108 {\n                if let Some(family) = kice09_composite_family(char_pr_id) {\n                    style.font_family = family.to_string();\n                    style.font_families = vec![family.to_string(); LANG_COUNT];\n                }\n            }\n            style\n        })\n        .collect()\n}\n'''
          if old not in s:
              raise SystemExit('target resolve_char_styles block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          # 2) SVG/PDF decoration width bridge: trim only actual trailing whitespace.
          p=Path('rhwp-src/src/renderer/svg.rs')
          s=p.read_text(encoding='utf-8')
          marker='''        // 밑줄 처리\n        if !matches!(style.underline, UnderlineType::None) {\n            let text_width = *char_positions.last().unwrap_or(&0.0);\n'''
          replacement='''        // KICE09 print fidelity: only trim invisible trailing whitespace.\n        // Normal underline/strike runs keep the legacy width unchanged.\n        let decoration_text_width = || -> f64 {\n            let total = *char_positions.last().unwrap_or(&0.0);\n            let chars: Vec<char> = text.chars().collect();\n            let Some(last_visible) = chars.iter().rposition(|c| !c.is_whitespace()) else {\n                return 0.0;\n            };\n            if last_visible + 1 == chars.len() {\n                return total.max(0.0);\n            }\n            if last_visible + 1 >= char_positions.len() {\n                return total.max(0.0);\n            }\n            let visible_start = char_positions[last_visible];\n            let full_visible_advance = char_positions[last_visible + 1] - visible_start;\n            let mut tight_style = style.clone();\n            tight_style.letter_spacing = 0.0;\n            tight_style.extra_char_spacing = 0.0;\n            tight_style.extra_word_spacing = 0.0;\n            let last_char = chars[last_visible].to_string();\n            let tight_positions = compute_char_positions(&last_char, &tight_style);\n            let tight_visible_advance = *tight_positions.last().unwrap_or(&full_visible_advance);\n            (visible_start + tight_visible_advance).max(0.0)\n        };\n\n        // 밑줄 처리\n        if !matches!(style.underline, UnderlineType::None) {\n            let text_width = decoration_text_width();\n'''
          if marker not in s:
              raise SystemExit('underline width marker not found')
          s=s.replace(marker,replacement,1)
          strike='''        // 취소선 처리\n        if style.strikethrough {\n            let text_width = *char_positions.last().unwrap_or(&0.0);\n'''
          strike_new='''        // 취소선 처리\n        if style.strikethrough {\n            let text_width = decoration_text_width();\n'''
          if strike not in s:
              raise SystemExit('strike width marker not found')
          p.write_text(s.replace(strike,strike_new,1),encoding='utf-8')

          # 3) Floating shape anchored to a later line of a paragraph.
          p=Path('rhwp-src/src/renderer/layout/shape_layout.rs')
          s=p.read_text(encoding='utf-8')
          old='''        // 통합 좌표 계산 (layout_body_picture와 동일 로직)\n        let shape_container = LayoutRect {\n            x: col_area.x + para_margin_left,\n            y: para_y,\n            width: col_area.width - para_margin_left - para_margin_right,\n            height: col_area.height - (para_y - col_area.y).max(0.0),\n        };\n'''
          new='''        // Para-relative floating objects are anchored to the LINE_SEG that\n        // contains their control slot. HWP's vertical_offset is relative to that\n        // anchor line, not always to the paragraph's first line.\n        let shape_para_y = if !common.treat_as_char\n            && matches!(common.vert_rel_to, crate::model::shape::VertRelTo::Para)\n            && para.line_segs.len() > 1\n        {\n            let text_len = para.text.chars().count();\n            let control_pos = para\n                .control_text_positions()\n                .get(control_index)\n                .copied()\n                .unwrap_or(text_len);\n            let utf16_pos = if control_pos < para.char_offsets.len() {\n                para.char_offsets[control_pos]\n            } else {\n                u32::MAX\n            };\n            let anchor_seg = if control_pos >= text_len {\n                para.line_segs.last()\n            } else {\n                para.line_segs\n                    .iter()\n                    .rev()\n                    .find(|seg| seg.text_start <= utf16_pos)\n            };\n            para_y + anchor_seg\n                .map(|seg| hwpunit_to_px(seg.vertical_pos, self.dpi))\n                .unwrap_or(0.0)\n        } else {\n            para_y\n        };\n\n        // 통합 좌표 계산 (layout_body_picture와 동일 로직)\n        let shape_container = LayoutRect {\n            x: col_area.x + para_margin_left,\n            y: shape_para_y,\n            width: col_area.width - para_margin_left - para_margin_right,\n            height: col_area.height - (shape_para_y - col_area.y).max(0.0),\n        };\n'''
          if old not in s:
              raise SystemExit('shape_container block not found')
          s=s.replace(old,new,1)
          old_call='''                paper_area,\n                para_y,\n                alignment,\n            )\n'''
          new_call='''                paper_area,\n                shape_para_y,\n                alignment,\n            )\n'''
          if old_call not in s:
              raise SystemExit('compute_object_position para_y call not found')
          p.write_text(s.replace(old_call,new_call,1),encoding='utf-8')

          # 4) Paragraph numbering marker style.
          # The HWP numbering definition has its own charShapeRef (KICE09 numbering 1,
          # level 0 -> charPr 10 / Hanyang GyeonMyeongjo). rhwp v0.8.4 instead paints
          # the marker using the first body run, making 1.-45. thin and the wrong face.
          # Keep this bridge narrowly scoped to the 108-charPr KICE09 master.
          p=Path('rhwp-src/src/renderer/layout/paragraph_layout.rs')
          s=p.read_text(encoding='utf-8')
          old='''fn numbering_marker_text_style(\n    styles: &ResolvedStyleSet,\n    para: Option<&Paragraph>,\n    first_run: Option<&ComposedTextRun>,\n) -> TextStyle {\n    if let Some(run) = first_run {\n        resolved_to_text_style(styles, run.char_style_id, run.lang_index)\n    } else {\n        paragraph_active_text_style(styles, para, 0).0\n    }\n}\n'''
          new='''fn numbering_marker_text_style(\n    styles: &ResolvedStyleSet,\n    para: Option<&Paragraph>,\n    first_run: Option<&ComposedTextRun>,\n) -> TextStyle {\n    // KICE09: NUMBER id=1 level=0 explicitly points at charPr 10.\n    // v0.8.4 drops NumberingHead.char_shape_id at paint time and inherits the\n    // first body run instead, so question numbers lose their original face/weight.\n    if styles.char_styles.len() == 108 {\n        if let Some(para) = para {\n            if let Some(ps) = styles.para_styles.get(para.para_shape_id as usize) {\n                if matches!(ps.head_type, HeadType::Number)\n                    && ps.numbering_id == 1\n                    && ps.para_level == 0\n                {\n                    return resolved_to_text_style(styles, 10, 0);\n                }\n            }\n        }\n    }\n    if let Some(run) = first_run {\n        resolved_to_text_style(styles, run.char_style_id, run.lang_index)\n    } else {\n        paragraph_active_text_style(styles, para, 0).0\n    }\n}\n'''
          if old not in s:
              raise SystemExit('numbering_marker_text_style block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          cd rhwp-src
          cargo build --release --bin rhwp
          ./target/release/rhwp capabilities > ../rhwp-capabilities.json

      - name: Render untouched HWP with native KICE09 composite faces
        shell: bash
        env:
          RHWP_FONT_PATH: ${{ github.workspace }}/runtime_fonts
        run: |
          set -euxo pipefail
          RHWP='./rhwp-src/target/release/rhwp'
          mkdir -p out/svg out/dump-pages
          "$RHWP" info input.hwp > out/info.txt
          for p in 0 1 2 3 4; do
            "$RHWP" export-svg input.hwp -p "$p" -o out/svg
            "$RHWP" export-pdf input.hwp -p "$p" --text-as-paths -o "out/page-$((p+1))-paths.pdf"
            "$RHWP" export-pdf input.hwp -p "$p" -o "out/page-$((p+1))-embedded.pdf"
            "$RHWP" dump-pages input.hwp -p "$p" > "out/dump-pages/page-$((p+1)).txt"
          done

      - name: Upload smoke-test artifact
        uses: actions/upload-artifact@v7
        with:
          name: rhwp-kice09-composite-pages
          path: |
            out/**
            rhwp-capabilities.json
          if-no-files-found: error
          compression-level: 0