name: rhwp HWP smoke test

on:
  push:
    branches: [rhwp-smoke-20260825]
    paths:
      - '.github/workflows/rhwp-smoke.yml'
  pull_request:
    branches: [main, rhwp-ci-base]
    paths:
      - '.github/workflows/rhwp-smoke.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout font repo
        uses: actions/checkout@v7

      - name: Download original 2009 June HWP
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://t1.daumcdn.net/cfile/tistory/262D61365269C48115'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -e 'https://legendstudy.com/223' "$URL" -o input.hwp
          echo '59af2533f5a12fee6685f9c9f3b8a646a54997badaba3c062138c7d04f5e6205  input.hwp' | sha256sum -c -

      - name: Prepare runtime font copies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --quiet fonttools
          mkdir -p runtime_fonts
          python - <<'PY'
          from fontTools.ttLib import TTFont
          from pathlib import Path
          import shutil
          src=Path('output_ttf'); dst=Path('runtime_fonts')
          for i,p in enumerate(sorted(src.glob('*.ttf')),1):
              out=dst/p.name
              shutil.copy2(p,out)
              f=TTFont(out)
              ps=f'KICE09Combo{i:02d}-Regular'
              for n in f['name'].names:
                  if n.nameID==6:
                      if n.isUnicode(): n.string=ps.encode('utf-16-be')
                      else: n.string=ps.encode('latin1')
              f.save(out)
          PY

      - name: Build rhwp v0.8.4 with KICE09 font and decoration bridges
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v0.8.4 https://github.com/edwardkim/rhwp.git rhwp-src
          python - <<'PY'
          from pathlib import Path

          # 1) KICE09 charPr -> composite TTF family bridge
          p=Path('rhwp-src/src/renderer/style_resolver.rs')
          s=p.read_text(encoding='utf-8')
          old='''fn resolve_char_styles(doc_info: &DocInfo, dpi: f64) -> Vec<ResolvedCharStyle> {\n    doc_info\n        .char_shapes\n        .iter()\n        .map(|cs| resolve_single_char_style(cs, doc_info, dpi))\n        .collect()\n}\n'''
          new='''fn kice09_composite_family(char_pr_id: usize) -> Option<&'static str> {\n    match char_pr_id {\n        0 | 68 => Some("한양중고딕"),\n        1 | 19 | 20 => Some("신명 디나루"),\n        2 | 25 => Some("신명 중고딕"),\n        5 | 11 | 17 | 42 | 49 | 59 | 63 | 72 | 82 | 84 | 85 => Some("신명 중명조 - 한양영문"),\n        6 | 93 => Some("신명 중명조"),\n        7 | 8 | 9 | 12 | 13 | 14 | 15 | 23 | 24 | 29 | 32 | 33 | 34 | 47 | 56 | 60 | 61 | 64 | 65 | 67 | 70 | 71 | 74 | 75 | 76 | 77 | 78 | 79 | 80 | 81 | 83 | 86 | 88 | 89 | 90 | 91 | 92 | 94 | 95 | 99 | 100 | 101 | 102 | 103 | 104 | 105 | 106 | 107 => Some("신명 중명조 - 한양문자"),\n        16 | 73 | 87 => Some("신명 태고딕"),\n        18 => Some("한양견명조"),\n        21 | 48 | 54 | 55 => Some("신명 견명조"),\n        22 => Some("#태고딕"),\n        46 | 51 | 52 | 53 | 57 | 58 => Some("신명 신그래픽"),\n        50 => Some("신명 궁서"),\n        96 | 97 | 98 => Some("신명 중고딕 - 혼합"),\n        _ => None,\n    }\n}\n\nfn resolve_char_styles(doc_info: &DocInfo, dpi: f64) -> Vec<ResolvedCharStyle> {\n    doc_info\n        .char_shapes\n        .iter()\n        .enumerate()\n        .map(|(char_pr_id, cs)| {\n            let mut style = resolve_single_char_style(cs, doc_info, dpi);\n            if doc_info.char_shapes.len() == 108 {\n                if let Some(family) = kice09_composite_family(char_pr_id) {\n                    style.font_family = family.to_string();\n                    style.font_families = vec![family.to_string(); LANG_COUNT];\n                }\n            }\n            style\n        })\n        .collect()\n}\n'''
          if old not in s:
              raise SystemExit('target resolve_char_styles block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          # 2) SVG/PDF decoration width bridge.
          # compute_char_positions() includes letter/Justify spacing after the final glyph.
          # That spacing is needed to position following glyphs, but it must not extend
          # underline/strike past the final painted glyph.
          p=Path('rhwp-src/src/renderer/svg.rs')
          s=p.read_text(encoding='utf-8')
          marker='''        // 밑줄 처리\n        if !matches!(style.underline, UnderlineType::None) {\n            let text_width = *char_positions.last().unwrap_or(&0.0);\n'''
          replacement='''        // KICE09 print fidelity: decoration ends at the final glyph, not at\n        // the trailing tracking/Justify advance carried by char_positions.\n        let decoration_text_width = || -> f64 {\n            let total = *char_positions.last().unwrap_or(&0.0);\n            if text.is_empty() || char_positions.len() < 2 {\n                return total.max(0.0);\n            }\n            let full_last_advance = char_positions[char_positions.len() - 1]\n                - char_positions[char_positions.len() - 2];\n            let mut tight_style = style.clone();\n            tight_style.letter_spacing = 0.0;\n            tight_style.extra_char_spacing = 0.0;\n            let last_char = text.chars().last().unwrap().to_string();\n            let tight_positions = compute_char_positions(&last_char, &tight_style);\n            let tight_last_advance = *tight_positions.last().unwrap_or(&full_last_advance);\n            (total - full_last_advance + tight_last_advance).max(0.0)\n        };\n\n        // 밑줄 처리\n        if !matches!(style.underline, UnderlineType::None) {\n            let text_width = decoration_text_width();\n'''
          if marker not in s:
              raise SystemExit('underline width marker not found')
          s=s.replace(marker,replacement,1)
          strike='''        // 취소선 처리\n        if style.strikethrough {\n            let text_width = *char_positions.last().unwrap_or(&0.0);\n'''
          strike_new='''        // 취소선 처리\n        if style.strikethrough {\n            let text_width = decoration_text_width();\n'''
          if strike not in s:
              raise SystemExit('strike width marker not found')
          p.write_text(s.replace(strike,strike_new,1),encoding='utf-8')
          PY
          cd rhwp-src
          cargo build --release --bin rhwp
          ./target/release/rhwp capabilities > ../rhwp-capabilities.json

      - name: Render untouched HWP with native KICE09 composite faces
        shell: bash
        env:
          RHWP_FONT_PATH: ${{ github.workspace }}/runtime_fonts
        run: |
          set -euxo pipefail
          RHWP='./rhwp-src/target/release/rhwp'
          mkdir -p out/svg out/dump-pages
          "$RHWP" info input.hwp > out/info.txt
          for p in 0 1 2 3 4; do
            "$RHWP" export-svg input.hwp -p "$p" -o out/svg
            "$RHWP" export-pdf input.hwp -p "$p" --text-as-paths -o "out/page-$((p+1))-paths.pdf"
            "$RHWP" dump-pages input.hwp -p "$p" > "out/dump-pages/page-$((p+1)).txt"
          done

      - name: Upload smoke-test artifact
        uses: actions/upload-artifact@v7
        with:
          name: rhwp-kice09-composite-pages
          path: |
            out/**
            rhwp-capabilities.json
          if-no-files-found: error
          compression-level: 0
