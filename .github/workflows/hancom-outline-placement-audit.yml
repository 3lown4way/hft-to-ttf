name: Hancom HFT outline placement audit

on:
  push:
    paths:
      - '.github/workflows/hancom-outline-placement-audit.yml'
  pull_request:
    paths:
      - '.github/workflows/hancom-outline-placement-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download and extract official viewer
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -H 'Referer: https://www.hancom.com/' -A 'Mozilla/5.0' \
            'https://cdn.hancom.com/pds/hnc/VIE/hancomoffice-hwpviewer-Ubuntu-amd64.deb' -o hancom-viewer.deb
          mkdir deb
          cd deb
          ar x ../hancom-viewer.deb
          tar -xf data.tar.*
          cd ..
          test -x deb/usr/bin/hwpviewer

      - name: Trace HFT outline placement and scale operands
        shell: bash
        run: |
          set -euo pipefail
          BIN=deb/usr/bin/hwpviewer
          OUT=hancom-outline-placement-audit.txt
          : > "$OUT"

          echo '=== TARGET SYMBOLS / ADDRESSES / SIZES ===' >> "$OUT"
          readelf -Ws "$BIN" \
            | grep -E 'HFTGetGlyphOutline|HncGetGlyphOutline|HncGetFontOutline|HspDcDrawCharWithHftOutline|GetOlBitmap|GetOutlineData|GetFontWidth|HFTGetCharWidth|HncGetHFTCharWidth|GetGlyphIndexExt|LoadTypefaceDes|GetFont@@| HncGetFontOutline' \
            >> "$OUT" || true
          echo >> "$OUT"

          echo '=== HncGetFontOutline full body / raw operands ===' >> "$OUT"
          objdump -drwC --start-address=0x179c3d0 --stop-address=0x179c6e0 "$BIN" >> "$OUT" 2>&1 || true
          echo >> "$OUT"

          echo '=== HncGetFontOutline helper-call windows ===' >> "$OUT"
          objdump -d -C --no-show-raw-insn --start-address=0x179c3d0 --stop-address=0x179c6e0 "$BIN" 2>/dev/null \
            | grep -E -B 42 -A 72 '(call.*179a170|idiv|0x1c\(%rbp\)|0x18\(%rbp\))' \
            >> "$OUT" || true
          echo >> "$OUT"

          echo '=== Width resolver 0x179a100..0x179a360 ===' >> "$OUT"
          objdump -drwC --start-address=0x179a100 --stop-address=0x179a360 "$BIN" >> "$OUT" 2>&1 || true
          echo >> "$OUT"

          echo '=== GetFont full body 0x179bd10..0x179c3d0 ===' >> "$OUT"
          objdump -drwC --start-address=0x179bd10 --stop-address=0x179c3d0 "$BIN" >> "$OUT" 2>&1 || true
          echo >> "$OUT"

          echo '=== GetFont width-resolver dataflow windows ===' >> "$OUT"
          objdump -d -C --no-show-raw-insn --start-address=0x179bd10 --stop-address=0x179c3d0 "$BIN" 2>/dev/null \
            | grep -E -B 42 -A 70 '(call.*179a170|idiv|0x1c\(%r12\)|0x18\(%r12\))' \
            >> "$OUT" || true
          echo >> "$OUT"

          echo '=== GetFontWidth exact region ===' >> "$OUT"
          objdump -drwC --start-address=0x179ad30 --stop-address=0x179af40 "$BIN" >> "$OUT" 2>&1 || true
          echo >> "$OUT"

          echo '=== LoadTypefaceDes full body / descriptor construction ===' >> "$OUT"
          objdump -drwC --start-address=0x17a1cd0 --stop-address=0x17a2160 "$BIN" >> "$OUT" 2>&1 || true
          echo >> "$OUT"

          echo '=== LoadTypefaceDes header 0x180..0x1ae and descriptor +0x18/+0x1c windows ===' >> "$OUT"
          objdump -d -C --no-show-raw-insn --start-address=0x17a1cd0 --stop-address=0x17a2160 "$BIN" 2>/dev/null \
            | grep -E -B 20 -A 30 '(0x1(80|82|84|86|88|8a|8c|8e|90|92|94|96|98|9a|9c|9e|a0|a2|a4|a6|a8|aa|ac|ae)\(%r13\)|0x(18|1c)\(%rbx\))' \
            >> "$OUT" || true
          echo >> "$OUT"

          echo '=== GetOlBitmap full body ===' >> "$OUT"
          objdump -drwC --start-address=0x17a3270 --stop-address=0x17a3870 "$BIN" >> "$OUT" 2>&1 || true
          echo >> "$OUT"

          echo '=== GetOutlineData full body ===' >> "$OUT"
          objdump -drwC --start-address=0x17a3870 --stop-address=0x17a3e30 "$BIN" >> "$OUT" 2>&1 || true
          echo >> "$OUT"

          echo '=== Outline metadata / 8-byte bbox-offset record windows ===' >> "$OUT"
          objdump -d -C --no-show-raw-insn --start-address=0x17a3270 --stop-address=0x17a3e30 "$BIN" 2>/dev/null \
            | grep -E -B 36 -A 54 '(_read|0x54\(%rsp\)|0x56\(%rsp\)|0x58\(%rsp\)|0x5a\(%rsp\)|ZZAddRect)' \
            >> "$OUT" || true
          echo >> "$OUT"

          echo '=== HFT wrapper / exported outline path ===' >> "$OUT"
          objdump -drwC --start-address=0x17dc160 --stop-address=0x17dc3d0 "$BIN" >> "$OUT" 2>&1 || true
          echo >> "$OUT"

          echo '=== HspDcDrawCharWithHftOutline ===' >> "$OUT"
          objdump -drwC --start-address=0x1faf000 --stop-address=0x1faf300 "$BIN" >> "$OUT" 2>&1 || true
          echo >> "$OUT"

          echo '=== CALL SITES TO OUTLINE/WIDTH ENTRY POINTS ===' >> "$OUT"
          objdump -d -C --no-show-raw-insn "$BIN" 2>/dev/null \
            | grep -E -B 24 -A 40 '(call|jmp).*(179c3d0|179a170|17dc1b0|17dc280|17dc350|17dc380|1faf0d0|17a3270|17a3870)' \
            | head -n 9000 >> "$OUT" || true
          echo >> "$OUT"

          echo '=== HFT DRAW PATH SYMBOL NEIGHBORS ===' >> "$OUT"
          nm -D -C "$BIN" 2>/dev/null \
            | grep -E 'HFT|Hft|Outline|Glyph|CharWidth|DrawChar|TypefaceDes|GetFont' \
            | sort >> "$OUT" || true
          echo >> "$OUT"

          cat "$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: hancom-outline-placement-audit
          path: hancom-outline-placement-audit.txt
          if-no-files-found: error
