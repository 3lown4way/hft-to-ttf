name: Hancom HFT outline placement audit

on:
  push:
    paths:
      - '.github/workflows/hancom-outline-placement-audit.yml'
  pull_request:
    paths:
      - '.github/workflows/hancom-outline-placement-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download and extract official viewer
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -H 'Referer: https://www.hancom.com/' -A 'Mozilla/5.0' \
            'https://cdn.hancom.com/pds/hnc/VIE/hancomoffice-hwpviewer-Ubuntu-amd64.deb' -o hancom-viewer.deb
          mkdir deb
          cd deb
          ar x ../hancom-viewer.deb
          tar -xf data.tar.*
          cd ..
          test -x deb/usr/bin/hwpviewer

      - name: Isolate outline fitting core
        shell: bash
        run: |
          set -euo pipefail
          BIN=deb/usr/bin/hwpviewer
          OUT=hancom-outline-placement-audit.txt
          : > "$OUT"

          dump() {
            local title="$1" start="$2" stop="$3"
            echo "=== $title ===" >> "$OUT"
            objdump -d -C --no-show-raw-insn --start-address="$start" --stop-address="$stop" "$BIN" >> "$OUT" 2>&1 || true
            echo >> "$OUT"
          }

          echo '=== TARGET SYMBOLS ===' >> "$OUT"
          readelf -Ws "$BIN" | grep -E 'GetFontOutlineData|_HFTItemPlace|_HFTExportOutlineToEXT|_HFTDrawCharByOutline|_sHdcGetCharOutline|HFTGetGlyphOutline|HncGetFontOutline|GetOutlineData|GetFontWidth|GetFontEMSize' >> "$OUT" || true
          echo >> "$OUT"

          # Core point-scaling routine called after HFT outline program decoding.
          dump 'GetFontOutlineData 0x17a6750..0x17a6d80' 0x17a6750 0x17a6d80

          # Layout width generation before outline export.
          dump '_HFTItemPlace 0x17cb290..0x17cb6c0' 0x17cb290 0x17cb6c0

          # Outline export path; shows the exact EM/ratio operands passed to HFTGetGlyphOutline/GetFontWidth.
          dump '_HFTExportOutlineToEXT 0x17cb8b0..0x17cbdc0' 0x17cb8b0 0x17cbdc0

          # Normal draw path; compare its outline operands with export/PDF-like path.
          dump '_HFTDrawCharByOutline 0x17cc2f0..0x17cc540' 0x17cc2f0 0x17cc540
          dump '_sHdcGetCharOutline 0x17dbd60..0x17dc150' 0x17dbd60 0x17dc150

          # Higher-level font-guide wrappers used by legacy HFT output code.
          dump 'CHncFontGuide::HncGetFontOutline 0x17eea70..0x17eed10' 0x17eea70 0x17eed10
          dump 'CHncFontGuide::HFTGetGlyphOutline 0x17f0970..0x17f0a40' 0x17f0970 0x17f0a40
          dump 'CHncFontGuide::HFTGetCharWidth 0x17f0a40..0x17f0b00' 0x17f0a40 0x17f0b00

          # Keep the already-proven fallback-width normalization formula nearby for comparison.
          dump 'HncGetFontOutline fit/fallback window 0x179c4d0..0x179c5a0' 0x179c4d0 0x179c5a0
          dump 'GetFontWidth core 0x179adc0..0x179af30' 0x179adc0 0x179af30

          # Compact operand index: no full-binary call-site dump.
          echo '=== OPERAND/CALL INDEX ===' >> "$OUT"
          grep -n -E 'GetFontOutlineData|HFTGetGlyphOutline|HFTGetCharWidth|HncGetFontOutline|GetFontWidth|GetFontEMSize|HncIntMulDiv|imul|idiv|0x1c\(|0x18\(' "$OUT" | head -n 800 >> "$OUT.index" || true
          cat "$OUT.index" >> "$OUT" 2>/dev/null || true

          wc -l "$OUT"
          tail -n 40 "$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: hancom-outline-placement-audit
          path: hancom-outline-placement-audit.txt
          if-no-files-found: error
