name: Hancom HFT outline placement audit

on:
  push:
    paths:
      - '.github/workflows/hancom-outline-placement-audit.yml'
  pull_request:
    paths:
      - '.github/workflows/hancom-outline-placement-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download and extract official viewer
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -H 'Referer: https://www.hancom.com/' -A 'Mozilla/5.0' \
            'https://cdn.hancom.com/pds/hnc/VIE/hancomoffice-hwpviewer-Ubuntu-amd64.deb' -o hancom-viewer.deb
          mkdir deb
          cd deb
          ar x ../hancom-viewer.deb
          tar -xf data.tar.*
          cd ..
          test -x deb/usr/bin/hwpviewer

      - name: Trace section loader and glyph flags
        shell: bash
        run: |
          set -euo pipefail
          BIN=deb/usr/bin/hwpviewer
          OUT=hancom-outline-placement-audit.txt
          : > "$OUT"

          dump() {
            local title="$1" start="$2" stop="$3"
            echo "=== $title ===" >> "$OUT"
            objdump -drwC --start-address="$start" --stop-address="$stop" "$BIN" >> "$OUT" 2>&1 || true
            echo >> "$OUT"
          }

          echo '=== TARGET SYMBOLS ===' >> "$OUT"
          readelf -Ws "$BIN" | grep -E 'OpenFontFile|GetGlyphIndexExt|GetOutlineData|GetFontOutlineData' >> "$OUT" || true
          echo >> "$OUT"

          # OpenFontFile+0x130 lazily expands each 24-byte serialized section into
          # 48-byte sub-descriptors. These fields decide whether glyph records carry
          # an 8-byte per-glyph rect or use the descriptor-level default rect.
          dump 'OpenFontFile section expansion 0x17a1620..0x17a1cd0' 0x17a1620 0x17a1cd0

          # Resolver and consumer kept adjacent so flags/offset arrays can be mapped.
          dump 'GetGlyphIndexExt 0x17a2460..0x17a2a60' 0x17a2460 0x17a2a60
          dump 'GetOutlineData 0x17a3870..0x17a3e30' 0x17a3870 0x17a3e30

          # Jump table used by low-nibble sub-descriptor type 0..4.
          echo '=== GetGlyphIndexExt jump table bytes 0x2108890 ===' >> "$OUT"
          objdump -s --start-address=0x2108890 --stop-address=0x21088b0 "$BIN" >> "$OUT" 2>&1 || true
          echo >> "$OUT"

          echo '=== DATAFLOW INDEX ===' >> "$OUT"
          grep -n -E '0x10\(%r14\)|0x10\(%rsi\)|0x10\(%rbp\)|0xa\(%rbp\)|0x14\(%rbp\)|0x18\(%rbp\)|0x20\(%rbp\)|0x30\(%rbx\)|_read|_lseek|malloc|0x10|0x20|17a2460|17a3ded' "$OUT" | head -n 2000 >> "$OUT.index" || true
          cat "$OUT.index" >> "$OUT" 2>/dev/null || true

          wc -l "$OUT"
          tail -n 80 "$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: hancom-outline-placement-audit
          path: hancom-outline-placement-audit.txt
          if-no-files-found: error
