name: Hancom HFT outline placement audit

on:
  push:
    paths:
      - '.github/workflows/hancom-outline-placement-audit.yml'
  pull_request:
    paths:
      - '.github/workflows/hancom-outline-placement-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download and extract official viewer
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -H 'Referer: https://www.hancom.com/' -A 'Mozilla/5.0' \
            'https://cdn.hancom.com/pds/hnc/VIE/hancomoffice-hwpviewer-Ubuntu-amd64.deb' -o hancom-viewer.deb
          mkdir deb
          cd deb
          ar x ../hancom-viewer.deb
          tar -xf data.tar.*
          cd ..
          test -x deb/usr/bin/hwpviewer

      - name: Trace PDF HFT outline export path
        shell: bash
        run: |
          set -euo pipefail
          BIN=deb/usr/bin/hwpviewer
          OUT=hancom-outline-placement-audit.txt
          : > "$OUT"

          echo '=== TARGET SYMBOLS / SIZE ===' >> "$OUT"
          readelf -Ws "$BIN" | grep -E '_HFTExportOutlineToPDF|_HFTExportOutlineToEXT|HFTGetGlyphOutline|HFTGetCharWidth|GetFontWidth|GetFontEMSize' >> "$OUT" || true
          echo >> "$OUT"

          echo '=== ORDERED SYMBOLS 0x17cc000..0x17ce800 ===' >> "$OUT"
          nm -n -C "$BIN" | awk '$1 >= "00000000017cc000" && $1 <= "00000000017ce800"' >> "$OUT" || true
          echo >> "$OUT"

          echo '=== _HFTExportOutlineToPDF 0x17cd0a0..0x17ce800 ===' >> "$OUT"
          objdump -drwC --start-address=0x17cd0a0 --stop-address=0x17ce800 "$BIN" >> "$OUT" 2>&1 || true
          echo >> "$OUT"

          echo '=== PDF EXPORT OPERAND INDEX ===' >> "$OUT"
          grep -n -E 'HFTGetGlyphOutline|HFTGetCharWidth|GetFontWidth|GetFontEMSize|HncIntMulDiv|imul|idiv|sar|shr|shl|0x64|0x3e8|1000|100|call.*17dc1b0|call.*17dc280|call.*179ad30|call.*179b0f0' "$OUT" | head -n 2500 >> "$OUT.index" || true
          cat "$OUT.index" >> "$OUT" 2>/dev/null || true

          wc -l "$OUT"
          tail -n 100 "$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: hancom-outline-placement-audit
          path: hancom-outline-placement-audit.txt
          if-no-files-found: error
