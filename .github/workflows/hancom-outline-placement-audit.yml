name: Hancom HFT outline placement audit

on:
  push:
    paths:
      - '.github/workflows/hancom-outline-placement-audit.yml'
  pull_request:
    paths:
      - '.github/workflows/hancom-outline-placement-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download and extract official viewer
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -H 'Referer: https://www.hancom.com/' -A 'Mozilla/5.0' \
            'https://cdn.hancom.com/pds/hnc/VIE/hancomoffice-hwpviewer-Ubuntu-amd64.deb' -o hancom-viewer.deb
          mkdir deb
          cd deb
          ar x ../hancom-viewer.deb
          tar -xf data.tar.*
          cd ..
          test -x deb/usr/bin/hwpviewer

      - name: Trace g_pTextOutPdf registration and callback owner
        shell: bash
        run: |
          set -euo pipefail
          BIN=deb/usr/bin/hwpviewer
          OUT=hancom-outline-placement-audit.txt
          : > "$OUT"

          echo '=== PDF CALLBACK GLOBAL ===' >> "$OUT"
          nm -D -C "$BIN" | grep -E 'g_pTextOutPdf|TextOut.*Pdf|TextOut.*PDF|Pdf.*TextOut|PDF.*TextOut' >> "$OUT" || true
          echo >> "$OUT"

          echo '=== ALL XREFS TO g_pTextOutPdf (0x2c7fed0) ===' >> "$OUT"
          objdump -d -C --no-show-raw-insn "$BIN" 2>/dev/null \
            | grep -n -B 36 -A 52 '2c7fed0 <g_pTextOutPdf' \
            | head -n 5000 >> "$OUT" || true
          echo >> "$OUT"

          echo '=== LIKELY REGISTRATION SYMBOLS ===' >> "$OUT"
          nm -D -C "$BIN" 2>/dev/null \
            | grep -Ei 'Set.*(PDF|Pdf|TextOut)|Register.*(PDF|Pdf|TextOut)|Callback.*(PDF|Pdf|TextOut)|PrintPdf|HwpPrintPdf|PdfExport' \
            | head -n 1500 >> "$OUT" || true
          echo >> "$OUT"

          echo '=== PDF EXPORT CALLER/FALLBACK WINDOW ===' >> "$OUT"
          objdump -drwC --start-address=0x17ccc00 --stop-address=0x17cd5c0 "$BIN" >> "$OUT" 2>&1 || true
          echo >> "$OUT"

          wc -l "$OUT"
          tail -n 120 "$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: hancom-outline-placement-audit
          path: hancom-outline-placement-audit.txt
          if-no-files-found: error
