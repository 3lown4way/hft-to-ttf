name: Hancom HFT outline placement audit

on:
  push:
    paths:
      - '.github/workflows/hancom-outline-placement-audit.yml'
  pull_request:
    paths:
      - '.github/workflows/hancom-outline-placement-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download and extract official viewer
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -H 'Referer: https://www.hancom.com/' -A 'Mozilla/5.0' \
            'https://cdn.hancom.com/pds/hnc/VIE/hancomoffice-hwpviewer-Ubuntu-amd64.deb' -o hancom-viewer.deb
          mkdir deb
          cd deb
          ar x ../hancom-viewer.deb
          tar -xf data.tar.*
          cd ..
          test -x deb/usr/bin/hwpviewer

      - name: Trace glyph index metadata path
        shell: bash
        run: |
          set -euo pipefail
          BIN=deb/usr/bin/hwpviewer
          OUT=hancom-outline-placement-audit.txt
          : > "$OUT"

          dump() {
            local title="$1" start="$2" stop="$3"
            echo "=== $title ===" >> "$OUT"
            objdump -drwC --start-address="$start" --stop-address="$stop" "$BIN" >> "$OUT" 2>&1 || true
            echo >> "$OUT"
          }

          echo '=== TARGET SYMBOLS ===' >> "$OUT"
          readelf -Ws "$BIN" | grep -E 'GetGlyphIndex|GetOutlineData|GetOlBitmap|GetFontOutlineData|HFTGetGlyphOutline|HncGetFontOutline' >> "$OUT" || true
          echo >> "$OUT"

          # Static HFT glyph-index resolver. This is the remaining source of the
          # per-glyph flags/offset records consumed by GetOutlineData.
          dump 'GetGlyphIndexExt 0x17a2460..0x17a2a60' 0x17a2460 0x17a2a60

          # Exported/simpler sibling immediately following it for structure comparison.
          dump 'GetGlyphIndex 0x17a2a60..0x17a2ac0' 0x17a2a60 0x17a2ac0

          # Generic driver implementation of the same resolver.
          dump 'CHncFontDriverGeneric::_GetGlyphIndexExt 0x180a4e0..0x180aae0' 0x180a4e0 0x180aae0

          # Consumers: identify which returned pointer fields, flags and file offsets
          # select the 8-byte record and component placement path.
          dump 'GetOlBitmap/GetOutlineData caller window 0x17a3270..0x17a3e30' 0x17a3270 0x17a3e30

          echo '=== DATAFLOW INDEX ===' >> "$OUT"
          grep -n -E 'call.*17a2460|call.*180a4e0|0x8\(%rbp\)|0xa\(%rbp\)|0x14\(%rbp\)|0x10|0x20|_read|lseek|fseek|0x90\(%rsp\)|0xa0\(%rsp\)|0xb0\(%rsp\)|0xd0\(%rsp\)|0xd4\(%rsp\)' "$OUT" | head -n 1500 >> "$OUT.index" || true
          cat "$OUT.index" >> "$OUT" 2>/dev/null || true

          wc -l "$OUT"
          tail -n 80 "$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: hancom-outline-placement-audit
          path: hancom-outline-placement-audit.txt
          if-no-files-found: error
