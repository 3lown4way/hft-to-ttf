name: Vendor customized rhwp

on:
  push:
    paths:
      - '.github/workflows/vendor-custom-rhwp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vendor pinned rhwp source-only tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf rhwp/custom /tmp/rhwp-upstream
          git clone --filter=blob:none --no-checkout --depth=1 https://github.com/edwardkim/rhwp.git /tmp/rhwp-upstream
          git -C /tmp/rhwp-upstream fetch --depth=1 origin 496333b27d21ddb9114ba9ae340bcb895870c9a7
          git -C /tmp/rhwp-upstream sparse-checkout init --no-cone
          cat > /tmp/rhwp-upstream/.git/info/sparse-checkout <<'EOF'
          /src/
          /tests/
          /Cargo.toml
          /Cargo.lock
          /rust-toolchain.toml
          /rustfmt.toml
          /.cargo/
          /.gitignore
          /LICENSE
          /README.md
          /README_EN.md
          /CLAUDE.md
          EOF
          git -C /tmp/rhwp-upstream checkout --detach FETCH_HEAD
          mkdir -p rhwp/custom
          cp -a /tmp/rhwp-upstream/src rhwp/custom/
          [ ! -d /tmp/rhwp-upstream/tests ] || cp -a /tmp/rhwp-upstream/tests rhwp/custom/
          [ ! -d /tmp/rhwp-upstream/.cargo ] || cp -a /tmp/rhwp-upstream/.cargo rhwp/custom/
          for f in Cargo.toml Cargo.lock rust-toolchain.toml rustfmt.toml .gitignore LICENSE README.md README_EN.md CLAUDE.md; do
            [ ! -e "/tmp/rhwp-upstream/$f" ] || cp -a "/tmp/rhwp-upstream/$f" rhwp/custom/
          done

      - name: Restore preserved KICE/HFT runtime font metrics
        shell: bash
        run: |
          set -euo pipefail
          base64 -d rhwp/recovery/font_metrics_data.rs.gz.b64 | gzip -dc > rhwp/custom/src/renderer/font_metrics_data.rs
          actual="$(sha256sum rhwp/custom/src/renderer/font_metrics_data.rs | awk '{print $1}')"
          expected="5c0c65ced6f93236aac5279cbdbc9306672ec67dbcef2d1a77878af18385a007"
          test "$actual" = "$expected"

      - name: Record recovery metadata
        shell: bash
        run: |
          cat > rhwp/custom/JH_KICE_RECOVERY.md <<'EOF'
          # JH/KICE customized rhwp recovery

          This source snapshot is reconstructed from `edwardkim/rhwp` commit
          `496333b27d21ddb9114ba9ae340bcb895870c9a7` (v0.8.4), then overlaid with
          the rhwp source change that survived the previous JH working session:

          - `src/renderer/font_metrics_data.rs` generated from the 13 HFT-derived
            KICE runtime fonts.

          Preserved SHA-256 of that source file:
          `5c0c65ced6f93236aac5279cbdbc9306672ec67dbcef2d1a77878af18385a007`.

          The complete unmodified upstream repository remains pinned at
          `rhwp/upstream`; this vendored tree intentionally keeps source/tests/build
          metadata and omits upstream's very large binary/sample/document assets.

          Other session work such as quote glyph placement and HY견고딕 lives in
          the HFT/font pipeline and must not be replaced by arbitrary system fonts.

          KICE inline boxed terms must follow the HWP GSO rectangle +
          `treat_as_char=true` path, not a detached absolute-position shape.
          EOF

      - name: Commit vendored customized tree to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rhwp/custom
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'vendor: restore customized rhwp source tree'
          fi
          git push --force origin HEAD:refs/heads/jh/rhwp-vendored
