name: build rhwp editor only
on:
  push:
    branches: [rhwp-smoke-20260825]
    paths:
      - '.github/workflows/build-rhwp-editor-only.yml'
      - 'tools/rhwp_template_editor.rs'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: git clone --depth 1 --branch v0.8.4 https://github.com/edwardkim/rhwp.git rhwp-src
      - run: cp tools/rhwp_template_editor.rs rhwp-src/src/bin/rhwp-template-editor.rs
      - run: cd rhwp-src && cargo build --release --bin rhwp-template-editor
      - uses: actions/upload-artifact@v7
        with:
          name: rhwp-template-editor-linux-x64
          path: rhwp-src/target/release/rhwp-template-editor
          compression-level: 0
