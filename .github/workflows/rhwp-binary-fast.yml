name: rhwp binary fast rebuild

on:
  push:
    branches: [rhwp-smoke-20260825]
    paths:
      - '.github/workflows/rhwp-binary-fast.yml'
      - 'tools/patch_rhwp_official_hft_faces.py'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout font repo
        uses: actions/checkout@v7

      - name: Reuse source-derived runtime fonts
        uses: actions/download-artifact@v4
        with:
          name: rhwp-hft-native-runtime
          path: previous-runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33042855217

      - name: Prepare runtime fonts
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf runtime_fonts
          cp -a previous-runtime/runtime_fonts runtime_fonts
          test "$(find runtime_fonts -maxdepth 1 -name '*.ttf' | wc -l)" -eq 13

      - name: Clone and prepare rhwp
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v0.8.4 https://github.com/edwardkim/rhwp.git rhwp-src
          cd rhwp-src
          cargo build --release --bin font-metric-gen
          ./target/release/font-metric-gen --dir ../runtime_fonts --output src/renderer/font_metrics_data.rs
          cd ..
          python tools/patch_rhwp_hft_native.py rhwp-src
          python tools/patch_rhwp_official_hft_faces.py rhwp-src
          python tools/patch_rhwp_hft_synthetic_bold.py rhwp-src

      - name: Build rhwp native-skia
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libfontconfig1-dev
          cd rhwp-src
          cargo build --release --features native-skia --bin rhwp
          ./target/release/rhwp capabilities > ../rhwp-capabilities.json

      - name: Upload rhwp runtime bundle
        uses: actions/upload-artifact@v7
        with:
          name: rhwp-hft-native-runtime-fast
          path: |
            rhwp-src/target/release/rhwp
            runtime_fonts/*.ttf
            rhwp-capabilities.json
          if-no-files-found: error
          compression-level: 0
