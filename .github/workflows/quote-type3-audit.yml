name: quote Type3 audit

on:
  push:
    branches: [rhwp-smoke-20260825]
    paths:
      - '.github/workflows/quote-type3-audit.yml'
      - 'tools/audit_hft_source_truth.py'
  pull_request:
    branches: [main, rhwp-ci-base]
    paths:
      - '.github/workflows/quote-type3-audit.yml'
      - 'tools/audit_hft_source_truth.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download oracle PDF
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -e 'https://savetest.com/18' \
            'https://t1.daumcdn.net/cfile/tistory/1542AA124CE785323E' \
            -o original-2009-june-language.pdf

      - name: Audit HFT metrics and oracle quote horizontal semantics
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --quiet fonttools pymupdf
          python tools/audit_hft_source_truth.py | tee quote-type3-audit.txt

      - uses: actions/upload-artifact@v7
        with:
          name: quote-type3-audit
          path: quote-type3-audit.txt
          if-no-files-found: error
